<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minha Biblioteca">
<link rel="apple-touch-icon" href="bib.png">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<title>Minha Biblioteca</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

.header { padding: 20px; }

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    background: #e5e7eb;
    border-radius: 10px;
    font-weight: 600;
}

.tab.active {
    background: #0f172a;
    color: white;
}

.btn-topo {
    width: 100%;
    padding: 14px;
    background: #0f172a;
    color: white;
    border: none;
    border-radius: 10px;
    margin-bottom: 10px;
}

.em-leitura {
    background: #0f172a;
    color: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    gap: 12px;
    align-items: center;
}

.em-leitura img {
    width: 60px;
    border-radius: 6px;
}

.search-container input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

.counter {
    font-size: 14px;
    margin-top: 6px;
    color: #666;
}

.secao {
    background: white;
    margin-bottom: 10px;
}

.secao-titulo {
    padding: 15px 20px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #888;
    border-bottom: 1px solid #eee;
}

.item {
    display: flex;
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    align-items: center;
}

.item img {
    width: 70px;
    margin-right: 15px;
    border-radius: 8px;
}

.nome {
    font-size: 18px;
    font-weight: 600;
}

.info-extra {
    font-size: 13px;
    color: #666;
}

.rank {
    background: white;
    padding: 15px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
}

.rank img {
    width: 70px;
    margin-right: 15px;
    border-radius: 8px;
}

#btnAdd {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    font-size: 28px;
    background: #0f172a;
    color: white;
    border: none;
}

.overlay {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    z-index: 1000;
    padding: 20px;
}

.overlay input,
.overlay select {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    font-size: 16px;
}

.overlay button {
    width: 100%;
    padding: 16px;
    border: none;
    margin-bottom: 10px;
}

.btn-salvar { background: #0f172a; color: white; }
.btn-cancelar { background: #ccc; }

.login-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3000;
}

.login-card {
    background: white;
    width: 100%;
    max-width: 340px;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 25px 50px rgba(0,0,0,.3);
    animation: aparecer .3s ease;
}

@keyframes aparecer {
    from { transform: scale(.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.login-title {
    margin: 0;
    font-size: 24px;
    text-align: center;
}

.login-subtitle {
    margin: 8px 0 24px;
    text-align: center;
    color: #666;
    font-size: 14px;
}

.login-card input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 14px;
}

.senha-box {
    position: relative;
}

.senha-box span {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    opacity: .6;
}

.senha-box span:hover {
    opacity: 1;
}

.btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    font-size: 16px;
    margin-top: 8px;
}

.btn-secondary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #e5e7eb;
    font-size: 15px;
    margin-top: 10px;
}

</style>
</head>

<body>

    <div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1 class="login-title">Minha Biblioteca</h1>
        <p class="login-subtitle">Entre para acessar seus livros</p>

        <input id="loginUser" placeholder="Email">

        <div class="senha-box">
            <input id="loginPass" type="password" placeholder="Senha">
            <span onclick="toggleSenha()">👁️</span>
        </div>

        <button class="btn-primary" onclick="login()">Entrar</button>
        <button class="btn-secondary" onclick="registrar()">Criar conta</button>
    </div>
</div>


<div class="header">
    <h1>Minha Biblioteca</h1>

    <div class="tabs">
        <div class="tab active" onclick="trocarAba('catalogo')">Catálogo</div>
        <div class="tab" onclick="trocarAba('ranking')">Ranking</div>
    </div>

    <div id="areaCatalogo">
        <button class="btn-topo" onclick="escolherEmLeitura()">Escolher livro em leitura</button>
        <div id="emLeituraBox"></div>

        <div class="search-container">
            <input id="searchInput" placeholder="Buscar..." oninput="renderCatalogo()">
            <div class="counter" id="counter"></div>
        </div>
    </div>
</div>

<div id="catalogo"></div>
<div id="ranking" style="display:none"></div>

<button id="btnAdd" onclick="novoLivro()">＋</button>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
    <h2 id="tituloForm">Novo Livro</h2>
    <input id="autorInput" placeholder="Autor">
    <input id="tituloInput" placeholder="Título">
    <input 
  type="number" 
  id="lancamentoInput" 
  placeholder="Ano de lançamento"
  min="0"
  max="2100">

<select id="lidoInput">
    <option value="false">Não lido</option>
    <option value="true">Lido</option>
</select>

    <input 
  type="number" 
  id="notaInput"
  placeholder="Nota (0 a 5)"
  min="0"
  max="5"
  step="0.5">

    <input type="file" accept="image/*" id="fotoInput">

    <button class="btn-salvar" onclick="salvarLivro()">Salvar</button>
    <button class="btn-cancelar" onclick="fechar()">Cancelar</button>
    <button class="btn-excluir" id="btnExcluirLivro" onclick="excluirLivro()" style="display:none">
    Excluir Livro
</button>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB9ovy_Bdgqpov1iOsEmbqrSbGpQei9Xd8",
    authDomain: "livros-e59e6.firebaseapp.com",
    projectId: "livros-e59e6",
    storageBucket: "livros-e59e6.firebasestorage.app",
    messagingSenderId: "981007608184",
    appId: "1:981007608184:web:3e2600bdd23959b6c9008d",
    measurementId: "G-LKTR8MLLYY"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let usuarioLogado = null;
let livros = [];
let imagemBase64 = "";
let abaAtual = "catalogo";

// 🔐 LOGIN STATE
auth.onAuthStateChanged(user => {
    if (user) {
        usuarioLogado = user.uid;
        iniciarAppFirebase();
    } else {
        loginScreen.style.display = "flex";
        document.body.style.overflow = "hidden";
    }
});

// LOGIN
function login() {
    auth.signInWithEmailAndPassword(
        loginUser.value.trim(),
        loginPass.value
    ).catch(e => alert(e.message));
}

// CADASTRO
function registrar() {
    auth.createUserWithEmailAndPassword(
        loginUser.value.trim(),
        loginPass.value
    ).catch(e => alert(e.message));
}

// INICIAR
function iniciarAppFirebase() {
    loginScreen.style.display = "none";
    document.body.style.overflow = "auto";

    db.collection("users")
      .doc(usuarioLogado)
      .collection("livros")
      .onSnapshot(snapshot => {
          livros = snapshot.docs.map(d => ({
              id: d.id,
              ...d.data()
          }));
          renderCatalogo();
      });
}

// IMAGEM
fotoInput.onchange = e => {
    const r = new FileReader();
    r.onload = () => imagemBase64 = r.result;
    r.readAsDataURL(e.target.files[0]);
};

// SALVAR LIVRO (CORRETO)
function salvarLivro() {
    if (!autorInput.value || !tituloInput.value || !lancamentoInput.value) {
        alert("Preencha tudo!");
        return;
    }

    let id = overlay.dataset.editando || Date.now().toString();

    const livro = {
        autor: autorInput.value,
        titulo: tituloInput.value,
        lancamento: lancamentoInput.value,
        lido: lidoInput.value === "true",
        nota: parseFloat(notaInput.value) || 0,
        capa: imagemBase64,
        emLeitura: false
    };

    db.collection("users")
      .doc(usuarioLogado)
      .collection("livros")
      .doc(id)
      .set(livro);

    delete overlay.dataset.editando;
    fechar();
}

// EXCLUIR
function excluirLivro() {
    const id = overlay.dataset.editando;
    if (!id) return;

    if (!confirm("Tem certeza?")) return;

    db.collection("users")
      .doc(usuarioLogado)
      .collection("livros")
      .doc(id)
      .delete();

    delete overlay.dataset.editando;
    fechar();
}

// RESTO DO TEU CÓDIGO (SEM ALTERAÇÃO)
function trocarAba(a) {
    abaAtual = a;
    catalogo.style.display = a === "catalogo" ? "block" : "none";
    ranking.style.display = a === "ranking" ? "block" : "none";
    areaCatalogo.style.display = a === "catalogo" ? "block" : "none";

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelector(`.tab[onclick*="${a}"]`).classList.add("active");

    a === "catalogo" ? renderCatalogo() : renderRanking();
}

function toggleSenha() {
    loginPass.type = loginPass.type === "password" ? "text" : "password";
}

function renderEmLeitura() {
    const l = livros.find(x => x.emLeitura);
    if (!l) return emLeituraBox.innerHTML = "";

    emLeituraBox.innerHTML = `
        <div class="em-leitura">
            <img src="${l.capa}">
            <strong>${l.titulo}</strong>
        </div>`;
}

function renderCatalogo() {
    renderEmLeitura();
    const busca = searchInput.value.toLowerCase();
    catalogo.innerHTML = "";
    let total = 0;

    livros.forEach(l => {
        if (!`${l.autor} ${l.titulo}`.toLowerCase().includes(busca)) return;
        total++;

        const div = document.createElement("div");
        div.className = "item";
        div.onclick = () => editarLivro(l.id);

        div.innerHTML = `
        <img src="${l.capa}">
        <div>
            <div class="nome">${l.titulo}</div>
            <div class="info-extra">
                ${l.autor}
                ${l.lancamento ? " · " + l.lancamento : ""}
                · ${l.lido ? "Lido" : "Não lido"}
                ${l.lido && l.nota ? " · " + estrelas(l.nota) : ""}
            </div>
        </div>`;

        catalogo.appendChild(div);
    });

    counter.innerText = total + " livros";
}

function editarLivro(id) {
    const l = livros.find(x => x.id === id);
    if (!l) return;

    tituloForm.innerText = "Editar Livro";

    autorInput.value = l.autor || "";
    tituloInput.value = l.titulo || "";
    lancamentoInput.value = l.lancamento || "";
    lidoInput.value = l.lido ? "true" : "false";
    notaInput.value = l.nota ?? "";
    imagemBase64 = l.capa || "";

    overlay.dataset.editando = id;
    btnExcluirLivro.style.display = "block";
    overlay.style.display = "block";
}

function renderRanking() {
    ranking.innerHTML = "";
    [...livros].sort((a,b) => (b.nota||0)-(a.nota||0)).forEach((l,i) => {
        const div = document.createElement("div");
        div.className = "rank";
        div.innerHTML = `
            <img src="${l.capa}">
            <div>
                <strong>#${i+1} ${l.titulo}</strong><br>
                ⭐ ${l.nota || 0}
            </div>`;
        ranking.appendChild(div);
    });
}

function novoLivro() {
    tituloForm.innerText = "Novo Livro";
    autorInput.value = "";
    tituloInput.value = "";
    lancamentoInput.value = "";
    lidoInput.value = "false";
    notaInput.value = "";
    imagemBase64 = "";

    btnExcluirLivro.style.display = "none";
    overlay.style.display = "block";
}

function estrelas(nota) {
    const cheias = Math.floor(nota);
    const meia = nota % 1 >= 0.5;
    return "⭐".repeat(cheias) + (meia ? "½" : "");
}

function fechar() {
    overlay.style.display = "none";
}

renderCatalogo();
</script>
<div class="overlay" id="overlayLeitura">
    <h2>Qual livro você está lendo?</h2>
    <div id="listaLeitura"></div>
    <button class="btn-cancelar" onclick="fecharEscolhaLeitura()">Cancelar</button>
</div>
</body>
</html>
