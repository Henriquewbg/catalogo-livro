<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: white;
    margin: 0;
}

.header { padding: 40px; }

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    background: #e5e7eb;
    border-radius: 10px;
    font-weight: 600;
}

.tab:hover { cursor: pointer; }

.tab.active {
    background: #0f172a;
    color: white;
}

.btn-topo {
    width: 100%;
    padding: 14px;
    background: #0f172a;
    color: white;
    border: none;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 15px;
}

.btn-topo:hover { cursor: pointer; }

.em-leitura {
    background: #0f172a;
    color: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    gap: 12px;
    align-items: center;
}

.em-leitura img {
    width: 60px;
    border-radius: 6px;
}

.search-container input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #ddd;

}

.counter {
    font-size: 14px;
    margin-top: 6px;
    color: #666;
}

.secao { background: white; margin-bottom: 10px; }

.secao-titulo {
    padding: 15px 20px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #888;
    border-bottom: 1px solid #eee;
}

/* MUDANÇA 1: item com posição relativa para acomodar botão excluir dentro da capa */
.item {
    display: flex;
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    align-items: center;
    position: relative;
}

/* MUDANÇA 1: wrapper da imagem com posição relativa para o botão flutuar sobre ela */
.item-img-wrapper {
    position: relative;
    width: 70px;
    margin-right: 15px;
    flex-shrink: 0;
}

.item-img-wrapper img {
    width: 70px;
    border-radius: 8px;

    cursor: zoom-in; /* MUDANÇA 3: cursor indica que clicando amplia */
}

/* MUDANÇA 2: botão excluir flutuando sobre a imagem */
.btn-apagar-card {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #ccc;
    padding: 6px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
    margin-left: 8px;
}

.btn-apagar-card:hover {
    color: #e53e3e;
    background: #fff0f0;
}

.item-info {
    flex: 1;
    cursor: pointer;
}

.nome {
    font-size: 18px;
    font-weight: 600;
}

.info-extra {
    font-size: 13px;
    color: #666;
}

/* MUDANÇA 3: overlay para ampliar imagem */
#overlayImagem {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    z-index: 2000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
}

#overlayImagem img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 12px;
    object-fit: contain;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

/* MUDANÇA 1: drag & drop para reordenar */
.item.dragging {
    opacity: 0.4;
}

.item.drag-over {
    border-top: 3px solid #0f172a;
}

.drag-handle {
    font-size: 18px;
    color: #ccc;
    cursor: grab;
    padding: 6px 8px 6px 0;
    flex-shrink: 0;
    user-select: none;
}

.drag-handle:active { cursor: grabbing; }

.rank {
    background: white;
    padding: 15px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
}

.rank img {
    width: 70px;
    margin-right: 15px;
    border-radius: 8px;
}

#btnAdd {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    font-size: 28px;
    background: #0f172a;
    color: white;
    border: none;
}

#btnAdd:hover { cursor: pointer; }

.overlay {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    z-index: 1000;
    padding: 20px;
    overflow-y: auto;
}

.overlay input,
.overlay select {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    font-size: 16px;
    box-sizing: border-box;
}

.overlay button:not(.estrela-btn) {
    width: 100%;
    padding: 16px;
    border: none;
    margin-bottom: 10px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.btn-salvar { background: #0f172a; color: white; }
.btn-cancelar { background: #ccc; }

.btn-salvar:hover { background: #272c38; }
.btn-cancelar:hover { background: #8d8b8b; }

.btn-excluir {
    background: #fee2e2;
    color: #b91c1c;
}

.btn-excluir:hover { background: #fecaca; }

#overlayLeitura {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    z-index: 1100;
    padding: 20px;
    overflow-y: auto;
}

#overlayLeitura h2 {
    margin-top: 0;
    margin-bottom: 20px;
}

.item-leitura {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border: 2px solid #eee;
    border-radius: 12px;
    margin-bottom: 10px;

    transition: border-color 0.15s, background 0.15s;
}

.item-leitura:hover {
    border-color: #0f172a;
    background: #f8fafc;
}

.item-leitura img {
    width: 54px;
    border-radius: 6px;
    margin-right: 14px;

}

.item-leitura .nome-leitura {
    font-size: 16px;

}

.item-leitura .autor-leitura {

}

.item-leitura.selecionado {
    border-color: #0f172a;
    background: #0f172a;
    color: white;
}

.item-leitura.selecionado .autor-leitura {
    color: #adb5bd;
}

#overlayLeitura button {
    width: 100%;
    padding: 16px;
    border: none;
    margin-bottom: 10px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.btn-remover-leitura {
    background: #fee2e2;
    color: #b91c1c;
    margin-top: 16px;
}

.btn-remover-leitura:hover { background: #fecaca; }


/* Widget de estrelas estilo Letterboxd */
.estrelas-widget {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
}

.estrela-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    width: 36px;
    height: 36px;

    justify-content: center;
    border-radius: 4px;

}

.estrela-btn:hover { transform: scale(1.15); }
.estrela-btn:active { transform: scale(0.95); }

.estrela-btn svg { display: block; }

.nota-label {
    font-size: 14px;
    color: #888;
    margin-left: 8px;
    min-width: 28px;
}

.login-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1d4800, #04ec4a);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3000;
}

.login-card {
    background: white;
    width: 100%;
    max-width: 340px;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 25px 50px rgba(0,0,0,.3);

}

@keyframes aparecer {
    from { transform: scale(.95); opacity: 0; }

}

.login-title { margin: 0; font-size: 24px; text-align: center; }

.login-subtitle {
    margin: 8px 0 24px;
    text-align: center;
    color: #666;
    font-size: 14px;
}

.login-card input {
    width: 90%;
    padding: 13px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 14px;
}

.senha-box { position: relative; }

.senha-box span {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    opacity: .6;
}

.senha-box span:hover { opacity: 1; }

.btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    font-size: 16px;
    margin-top: 8px;
    cursor: pointer;
}

.btn-primary:hover { background: #303131; }

.btn-secondary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #e5e7eb;
    font-size: 15px;
    margin-top: 10px;
    cursor: pointer;
}

.btn-secondary:hover { background: #bdc0c0; }
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1 class="login-title">Minha Biblioteca</h1>
        <p class="login-subtitle">Entre para acessar seus livros</p>
        <input id="loginUser" placeholder="Email">
        <div class="senha-box">
            <input id="loginPass" type="password" placeholder="Senha">
            <span onclick="toggleSenha()">👁️</span>
        </div>
        <button class="btn-primary" onclick="login()">Entrar</button>
        <button class="btn-secondary" onclick="registrar()">Criar conta</button>
    </div>
</div>

<div class="header">
    <h1>Minha Biblioteca</h1>

    <div class="tabs">
        <div class="tab active" onclick="trocarAba('catalogo')">Catálogo</div>
        <div class="tab" onclick="trocarAba('ranking')">Ranking</div>
    </div>

    <div id="areaCatalogo">
        <button class="btn-topo" onclick="escolherEmLeitura()">Escolher livro em leitura</button>

<div id="catalogo"></div>
<div id="ranking" style="display:none"></div>

<button id="btnAdd" onclick="novoLivro()">＋</button>

<!-- OVERLAY EDITAR/NOVO LIVRO -->
<div class="overlay" id="overlay">
    <h2 id="tituloForm">Novo Livro</h2>
    <input id="autorInput" placeholder="Autor">
    <input id="tituloInput" placeholder="Título">
    <input type="number" id="lancamentoInput" placeholder="Ano de lançamento" min="0" max="2100">
    <select id="lidoInput">
        <option value="false">Não lido</option>
        <option value="true">Lido</option>
    </select>

    <input type="file" accept="image/*" id="fotoInput">
    <button class="btn-salvar" onclick="salvarLivro()">Salvar</button>
    <button class="btn-cancelar" onclick="fechar()">Cancelar</button>

<!-- OVERLAY ESCOLHER LIVRO EM LEITURA -->
<div id="overlayLeitura">
    <h2>Qual livro você está lendo?</h2>
    <div id="listaLeitura"></div>
    <button class="btn-remover-leitura" id="btnRemoverLeitura" onclick="removerEmLeitura()" style="display:none">Tirar livro de em leitura</button>
    <button class="btn-cancelar" onclick="fecharEscolhaLeitura()">Cancelar</button>
</div>

<!-- MUDANÇA 3: overlay para ampliar imagem -->
<div id="overlayImagem" onclick="fecharImagem()">
    <img id="imagemAmpliadaSrc" src="" alt="">
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB9ovy_Bdgqpov1iOsEmbqrSbGpQei9Xd8",
    authDomain: "livros-e59e6.firebaseapp.com",
    projectId: "livros-e59e6",
    storageBucket: "livros-e59e6.firebasestorage.app",
    messagingSenderId: "981007608184",
    appId: "1:981007608184:web:3e2600bdd23959b6c9008d",
    measurementId: "G-LKTR8MLLYY"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let usuarioLogado = null;
let livros = [];
let imagemBase64 = "";
let abaAtual = "catalogo";

// MUDANÇA 1: variável para controlar a ordem personalizada
let ordemPersonalizada = [];

auth.onAuthStateChanged(user => {
    if (user) {
        usuarioLogado = user.uid;
        iniciarAppFirebase();
    } else {
        loginScreen.style.display = "flex";
        document.body.style.overflow = "hidden";
    }
});

function login() {
    auth.signInWithEmailAndPassword(loginUser.value.trim(), loginPass.value)
        .catch(e => alert(e.message));
}

function registrar() {
    auth.createUserWithEmailAndPassword(loginUser.value.trim(), loginPass.value)
        .catch(e => alert(e.message));
}

function iniciarAppFirebase() {
    loginScreen.style.display = "none";
    document.body.style.overflow = "auto";

    // MUDANÇA 1: carrega a ordem salva
    db.collection("users").doc(usuarioLogado).collection("config").doc("ordem")
      .get().then(doc => {
          if (doc.exists) ordemPersonalizada = doc.data().ids || [];
      });

    db.collection("users").doc(usuarioLogado).collection("livros")
      .onSnapshot(snapshot => {
          livros = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderCatalogo();
      });
}

fotoInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
            const MAX = 300;
            const scale = Math.min(1, MAX / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width  = Math.round(img.width  * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            imagemBase64 = canvas.toDataURL("image/jpeg", 0.7);
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
};

function salvarLivro() {
    if (!autorInput.value || !tituloInput.value || !lancamentoInput.value) {
        alert("Preencha tudo!");
        return;
    }

    const id = overlay.dataset.editando || Date.now().toString();
    const livroExistente = livros.find(l => l.id === id);
    const capaFinal = imagemBase64 || (livroExistente ? livroExistente.capa : "");

    const livro = {
        autor: autorInput.value,
        titulo: tituloInput.value,
        lancamento: lancamentoInput.value,
        lido: lidoInput.value === "true",
        nota: parseFloat(notaInput.value) || 0,
        capa: capaFinal,
        emLeitura: livroExistente ? livroExistente.emLeitura : false
    };

    db.collection("users").doc(usuarioLogado).collection("livros").doc(id).set(livro);
    delete overlay.dataset.editando;
    fechar();
}

function excluirLivro() {
    const id = overlay.dataset.editando;
    if (!id) return;
    if (!confirm("Tem certeza que deseja excluir este livro?")) return;

    db.collection("users").doc(usuarioLogado).collection("livros").doc(id).delete();
    // MUDANÇA 1: remove da ordem personalizada ao excluir
    ordemPersonalizada = ordemPersonalizada.filter(x => x !== id);
    salvarOrdem();
    delete overlay.dataset.editando;
    fechar();
}

function excluirLivroCard(id, titulo, event) {
    event.stopPropagation();
    if (!confirm(`Excluir "${titulo}"?`)) return;
    db.collection("users").doc(usuarioLogado).collection("livros").doc(id).delete();
    // MUDANÇA 1: remove da ordem personalizada ao excluir pelo card
    ordemPersonalizada = ordemPersonalizada.filter(x => x !== id);
    salvarOrdem();
}

// MUDANÇA 1: salva a ordem no Firestore
function salvarOrdem() {
    db.collection("users").doc(usuarioLogado).collection("config").doc("ordem")
      .set({ ids: ordemPersonalizada });
}

// MUDANÇA 1: retorna os livros na ordem personalizada
function livrosOrdenados(lista) {
    if (ordemPersonalizada.length === 0) return lista;
    const mapaOrdem = {};
    ordemPersonalizada.forEach((id, i) => mapaOrdem[id] = i);
    return [...lista].sort((a, b) => {
        const ia = mapaOrdem[a.id] !== undefined ? mapaOrdem[a.id] : 9999;
        const ib = mapaOrdem[b.id] !== undefined ? mapaOrdem[b.id] : 9999;
        return ia - ib;
    });
}

function trocarAba(a) {
    abaAtual = a;
    catalogo.style.display = a === "catalogo" ? "block" : "none";
    ranking.style.display = a === "ranking" ? "block" : "none";
    areaCatalogo.style.display = a === "catalogo" ? "block" : "none";
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelector(`.tab[onclick*="${a}"]`).classList.add("active");
    a === "catalogo" ? renderCatalogo() : renderRanking();
}

function toggleSenha() {
    loginPass.type = loginPass.type === "password" ? "text" : "password";
}

function renderEmLeitura() {
    const l = livros.find(x => x.emLeitura);
    if (!l) return emLeituraBox.innerHTML = "";
    emLeituraBox.innerHTML = `
        <div class="em-leitura">
            <img src="${l.capa}">
            <strong>${l.titulo}</strong>
        </div>`;
}

// MUDANÇA 3: abre overlay com imagem ampliada
function ampliarImagem(src, event) {
    event.stopPropagation();
    document.getElementById("imagemAmpliadaSrc").src = src;
    document.getElementById("overlayImagem").style.display = "flex";
}

function fecharImagem() {
    document.getElementById("overlayImagem").style.display = "none";
}

function renderCatalogo() {
    renderEmLeitura();
    const busca = searchInput.value.toLowerCase();
    catalogo.innerHTML = "";
    let total = 0;

    // MUDANÇA 1: usa lista ordenada
    const lista = livrosOrdenados(livros);

    lista.forEach(l => {
        if (!`${l.autor} ${l.titulo}`.toLowerCase().includes(busca)) return;
        total++;

        const div = document.createElement("div");
        div.className = "item";
        div.draggable = true;
        div.dataset.id = l.id;

        div.innerHTML = `
            <span class="drag-handle" title="Arrastar para reordenar">⠿</span>
            <div class="item-img-wrapper">
                <img src="${l.capa}" title="Ver capa">
            </div>
            <div class="item-info">
                <div class="nome">${l.titulo}</div>
                <div class="info-extra">
                    ${l.autor}
                    ${l.lancamento ? " · " + l.lancamento : ""}
                    · ${l.lido ? "Lido" : "Não lido"}
                    ${l.lido && l.nota ? " · " + estrelasSVG(l.nota) : ""}
                </div>
            </div>
        `;

        // clique na imagem amplia, não abre edição
        div.querySelector(".item-img-wrapper img").onclick = (e) => ampliarImagem(l.capa, e);

        // Clique na info abre edição
        div.querySelector(".item-info").onclick = () => editarLivro(l.id);


        // MUDANÇA 1: drag & drop (desktop)
        div.addEventListener("dragstart", onDragStart);
        div.addEventListener("dragover", onDragOver);
        div.addEventListener("drop", onDrop);
        div.addEventListener("dragend", onDragEnd);

        // MUDANÇA 1: drag & drop (touch/mobile)
        div.addEventListener("touchstart", onTouchStart, { passive: false });
        div.addEventListener("touchmove",  onTouchMove,  { passive: false });
        div.addEventListener("touchend",   onTouchEnd);

        catalogo.appendChild(div);
    });

    counter.innerText = total + " livros";
}

// MUDANÇA 1: lógica de drag & drop com scroll automático
let dragSrcId = null;
let scrollInterval = null;
const SCROLL_ZONE = 100; // px das bordas que ativa o scroll
const SCROLL_SPEED = 8;  // px por tick

function iniciarScrollAutomatico(clientY) {
    pararScrollAutomatico();
    scrollInterval = setInterval(() => {
        const vh = window.innerHeight;
        if (clientY < SCROLL_ZONE) {
            window.scrollBy(0, -SCROLL_SPEED);
        } else if (clientY > vh - SCROLL_ZONE) {
            window.scrollBy(0, SCROLL_SPEED);
        }
    }, 16);
}

function pararScrollAutomatico() {
    if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; }
}

function reordenarPor(dragId, targetId) {
    if (dragId === targetId) return;
    const listaAtual = livrosOrdenados(livros);
    const ids = listaAtual.map(l => l.id);
    const fromIdx = ids.indexOf(dragId);
    const toIdx   = ids.indexOf(targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    ids.splice(fromIdx, 1);
    ids.splice(toIdx, 0, dragId);
    const todosIds = livros.map(l => l.id);
    const naoExibidos = todosIds.filter(id => !ids.includes(id));
    ordemPersonalizada = [...ids, ...naoExibidos];
    salvarOrdem();
    renderCatalogo();
}

// ── Drag & drop (desktop) ──────────────────────────────────────────────────
function onDragStart(e) {
    dragSrcId = this.dataset.id;
    this.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
}

function onDragOver(e) {
    e.preventDefault();
    iniciarScrollAutomatico(e.clientY);
    document.querySelectorAll(".item").forEach(el => el.classList.remove("drag-over"));
    this.classList.add("drag-over");
    e.dataTransfer.dropEffect = "move";
}

function onDrop(e) {
    e.preventDefault();
    pararScrollAutomatico();
    reordenarPor(dragSrcId, this.dataset.id);
}

function onDragEnd() {
    pararScrollAutomatico();
    document.querySelectorAll(".item").forEach(el => {
        el.classList.remove("dragging");
        el.classList.remove("drag-over");
    });
}

// ── Touch (mobile) ─────────────────────────────────────────────────────────
let touchSrcId    = null;
let touchClone    = null;
let touchOffsetY  = 0;
let touchOffsetX  = 0;

function onTouchStart(e) {
    // Só inicia se o toque veio do handle
    if (!e.target.closest(".drag-handle")) return;
    e.preventDefault();

    const t = e.touches[0];
    const item = this;
    touchSrcId = item.dataset.id;

    // Cria clone visual que segue o dedo
    const rect = item.getBoundingClientRect();
    touchOffsetY = t.clientY - rect.top;
    touchOffsetX = t.clientX - rect.left;

    touchClone = item.cloneNode(true);
    touchClone.style.cssText = `
        position: fixed;
        left: ${rect.left}px;
        top: ${rect.top}px;
        width: ${rect.width}px;
        opacity: 0.85;
        pointer-events: none;
        z-index: 9999;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        border-radius: 8px;
        background: white;
    `;
    document.body.appendChild(touchClone);
    item.classList.add("dragging");
}

function onTouchMove(e) {
    if (!touchSrcId) return;
    e.preventDefault();
    const t = e.touches[0];

    // Move o clone
    touchClone.style.left = (t.clientX - touchOffsetX) + "px";
    touchClone.style.top  = (t.clientY - touchOffsetY) + "px";

    // Scroll automático
    iniciarScrollAutomatico(t.clientY);

    // Highlight do item abaixo do dedo
    document.querySelectorAll(".item").forEach(el => el.classList.remove("drag-over"));
    const elAbaixo = document.elementFromPoint(t.clientX, t.clientY);
    const itemAlvo = elAbaixo && elAbaixo.closest(".item");
    if (itemAlvo && itemAlvo.dataset.id && itemAlvo.dataset.id !== touchSrcId) {
        itemAlvo.classList.add("drag-over");
    }
}

function onTouchEnd(e) {
    if (!touchSrcId) return;
    pararScrollAutomatico();

    const t = e.changedTouches[0];
    const elAbaixo = document.elementFromPoint(t.clientX, t.clientY);
    const itemAlvo = elAbaixo && elAbaixo.closest(".item");

    if (itemAlvo && itemAlvo.dataset.id) {
        reordenarPor(touchSrcId, itemAlvo.dataset.id);
    }

    // Limpa
    if (touchClone) { touchClone.remove(); touchClone = null; }
    document.querySelectorAll(".item").forEach(el => {
        el.classList.remove("dragging");
        el.classList.remove("drag-over");
    });
    touchSrcId = null;
}

function editarLivro(id) {
    const l = livros.find(x => x.id === id);
    if (!l) return;

    tituloForm.innerText = "Editar Livro";
    autorInput.value = l.autor || "";
    tituloInput.value = l.titulo || "";
    lancamentoInput.value = l.lancamento || "";
    lidoInput.value = l.lido ? "true" : "false";
    renderEstrelasWidget(l.nota ?? 0);
    imagemBase64 = l.capa || "";

    overlay.dataset.editando = id;
    btnExcluirLivro.style.display = "block";
    overlay.style.display = "block";
}

function escolherEmLeitura() {
    const lista = document.getElementById("listaLeitura");
    lista.innerHTML = "";

    const temEmLeitura = livros.some(l => l.emLeitura);
    document.getElementById("btnRemoverLeitura").style.display = temEmLeitura ? "block" : "none";

    if (livros.length === 0) {
        lista.innerHTML = "<p style='color:#888'>Nenhum livro cadastrado.</p>";
    } else {
        livros.forEach(l => {
            const div = document.createElement("div");
            div.className = "item-leitura" + (l.emLeitura ? " selecionado" : "");

            div.innerHTML = `
                <img src="${l.capa}">
                <div>
                    <div class="nome-leitura">${l.titulo}</div>
                    <div class="autor-leitura">${l.autor}</div>
                </div>
            `;

            div.onclick = () => definirLivroEmLeitura(l.id);
            lista.appendChild(div);
        });
    }

    overlayLeitura.style.display = "block";
}

function definirLivroEmLeitura(idSelecionado) {
    const batch = db.batch();

    livros.forEach(l => {
        const ref = db.collection("users").doc(usuarioLogado).collection("livros").doc(l.id);
        batch.update(ref, { emLeitura: l.id === idSelecionado });
    });

    batch.commit().then(() => {
        fecharEscolhaLeitura();
    });
}

function removerEmLeitura() {
    const batch = db.batch();

    livros.forEach(l => {
        const ref = db.collection("users").doc(usuarioLogado).collection("livros").doc(l.id);
        batch.update(ref, { emLeitura: false });
    });

    batch.commit().then(() => {
        fecharEscolhaLeitura();
    });
}

function fecharEscolhaLeitura() {
    overlayLeitura.style.display = "none";
}

// MUDANÇA 4: só aparecem no ranking livros com nota >= 0.5
function renderRanking() {
    ranking.innerHTML = "";
    [...livros]
        .filter(l => (l.nota || 0) >= 0.5)
        .sort((a,b) => (b.nota||0)-(a.nota||0))
        .forEach((l,i) => {
            const div = document.createElement("div");
            div.className = "rank";
            div.innerHTML = `
                <img src="${l.capa}">
                <div>
                    <strong>#${i+1} ${l.titulo}</strong><br>
                    ${estrelasSVG(l.nota)}
                </div>`;
            ranking.appendChild(div);
        });

    if (ranking.innerHTML === "") {
        ranking.innerHTML = "<p style='color:#888; padding:20px'>Nenhum livro com nota ainda.</p>";
    }
}

function novoLivro() {
    tituloForm.innerText = "Novo Livro";
    autorInput.value = "";
    tituloInput.value = "";
    lancamentoInput.value = "";
    lidoInput.value = "false";
    renderEstrelasWidget(0);
    imagemBase64 = "";
    btnExcluirLivro.style.display = "none";
    overlay.style.display = "block";
}


// ── Widget de estrelas ─────────────────────────────────────────────────────
let _notaAtual = 0;
let _ultimaEstrelaClicada = null;

function renderEstrelasWidget(notaAtual) {
    _notaAtual = notaAtual || 0;
    _ultimaEstrelaClicada = null;
    _desenharEstrelas();
}

function _desenharEstrelas() {
    const container = document.getElementById("estrelasWidget");
    container.innerHTML = "";

    const wrap = document.createElement("div");
    wrap.className = "estrelas-widget";

    for (let i = 1; i <= 5; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "estrela-btn";
        btn.dataset.valor = i;
        btn.title = i + " estrelas";

        // fill: cheia, meia (gradiente com ID único por estrela) ou vazia
        const gradId = "halfGrad" + i;
        const fill = _notaAtual >= i ? "#f5a623"
                   : _notaAtual >= i - 0.5 ? `url(#${gradId})` : "#ddd";

        btn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24">
            <defs>
                <linearGradient id="${gradId}">
                    <stop offset="50%" stop-color="#f5a623"/>
                    <stop offset="50%" stop-color="#ddd"/>
                </linearGradient>
            </defs>
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
                fill="${fill}" stroke="#f5a623" stroke-width="1.2"/>
        </svg>`;

        btn.onclick = () => _clicouEstrela(i);
        wrap.appendChild(btn);
    }

    const label = document.createElement("span");
    label.className = "nota-label";
    label.id = "notaLabel";
    label.innerText = _notaAtual > 0 ? _notaAtual : "";
    wrap.appendChild(label);

    // Hover: preview
    wrap.querySelectorAll(".estrela-btn").forEach(btn => {
        btn.addEventListener("mouseenter", () => _previewNota(parseInt(btn.dataset.valor)));
        btn.addEventListener("mouseleave", () => _desenharEstrelas());
    });

    container.appendChild(wrap);
    document.getElementById("notaInput").value = _notaAtual;
}

function _previewNota(i) {
    const container = document.getElementById("estrelasWidget");
    container.querySelectorAll(".estrela-btn").forEach(btn => {
        const v = parseInt(btn.dataset.valor);
        const fill = v <= i ? "#f5a623" : "#ddd";
        btn.querySelector("polygon").setAttribute("fill", fill);
    });
    const lbl = document.getElementById("notaLabel");
    if (lbl) lbl.innerText = i;
}

function _clicouEstrela(i) {
    if (_ultimaEstrelaClicada === i && _notaAtual === i) {
        // segundo clique na mesma estrela: vira meia a menos
        _notaAtual = i - 0.5;
    } else {
        _notaAtual = i;
    }
    _ultimaEstrelaClicada = i;
    document.getElementById("notaInput").value = _notaAtual;
    _desenharEstrelas();
}
// ──────────────────────────────────────────────────────────────────────────

let _svgUid = 0;
function estrelasSVG(nota) {
    const uid = _svgUid++;
    let html = '<span style="display:inline-flex;gap:2px;vertical-align:middle">';
    for (let i = 1; i <= 5; i++) {
        const gradId = "sg_" + uid + "_" + i;
        let fill;
        if (nota >= i) fill = "#f5a623";
        else if (nota >= i - 0.5) fill = "url(#" + gradId + ")";
        else fill = "#ddd";
        html += `<svg width="14" height="14" viewBox="0 0 24 24" style="display:block">
            <defs><linearGradient id="${gradId}">
                <stop offset="50%" stop-color="#f5a623"/>
                <stop offset="50%" stop-color="#ddd"/>
            </linearGradient></defs>
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
                fill="${fill}" stroke="#f5a623" stroke-width="1.5"/>
        </svg>`;
    }
    html += '</span>';
    return html;
}

function estrelas(nota) {
    const cheias = Math.floor(nota);
    const meia = nota % 1 >= 0.5;
    return "⭐".repeat(cheias) + (meia ? "½" : "");
}

function fechar() {
    overlay.style.display = "none";
}

renderCatalogo();
</script>
